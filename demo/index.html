<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness OS · demo</title>
<link rel="stylesheet" href="../packages/dsh-startup-screen/lib/splash.css">
<style>
/* ============================================================================
 * Harness OS — DSH 主界面皮肤 demo
 * 底板 / 机框 / 品牌块 / 阶段格 / 页脚 与 dsh-startup-screen 1.6 终幕同坐标、
 * 同 token。揭幕时这些元素原地不动，其余部件按启动页的入场节奏装配。
 * ========================================================================== */
:root {
  --bg: #dedbd4;
  --bg-2: #f2efe8;
  --ink: #0b0c0d;
  --ink-soft: #34383a;
  --muted: #6c6f6c;
  --hair: rgba(20, 25, 28, 0.18);
  --hair-soft: rgba(20, 25, 28, 0.07);
  --accent: #ff7500;
  --accent-ink: #b84f00;
  --accent-2: #2c7a8a;
  --glitch-a: #ff3b30;
  --glitch-b: #2971b8;
  --box-bg: #0b0c0d;
  --box-ink: #f6f4ef;
  --glass: rgba(255, 252, 246, 0.58);
  --glass-hi: rgba(255, 255, 255, 0.72);
  --shadow: 0 24px 60px rgba(56, 46, 34, 0.14);
  --halo: var(--bg-2);

  --din: "Bahnschrift", "DIN Alternate", "DIN Condensed", "Archivo", "Oswald", "Arial Narrow",
    "Roboto Condensed", "HarmonyOS Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
  --mono: "Cascadia Mono", "SFMono-Regular", "Consolas", "Menlo", "DejaVu Sans Mono", ui-monospace, monospace;
  --zh: "Noto Sans SC", "Source Han Sans SC", "HarmonyOS Sans SC", "PingFang SC",
    "Microsoft YaHei UI", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;

  --ease: cubic-bezier(0.16, 0.84, 0.24, 1);
  --frame: 26px;
  --pad: 46px;
  --side-w: 344px;
  --rail-w: 286px;

  --brush: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='0.82 0.014' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='0.10' intercept='0.45'/><feFuncG type='linear' slope='0.10' intercept='0.45'/><feFuncB type='linear' slope='0.10' intercept='0.45'/><feFuncA type='linear' slope='0' intercept='1'/></feComponentTransfer></filter><rect width='420' height='420' filter='url(%23b)'/></svg>");
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #070a0e;
  --bg-2: #0d131a;
  --ink: #eef2f4;
  --ink-soft: #b8c3ca;
  --muted: #7d8c96;
  --hair: rgba(180, 210, 225, 0.16);
  --hair-soft: rgba(180, 210, 225, 0.055);
  --accent-ink: #ff9a45;
  --accent-2: #6fd3e8;
  --box-bg: #eef2f4;
  --box-ink: #070a0e;
  --glass: rgba(8, 15, 20, 0.56);
  --glass-hi: rgba(255, 255, 255, 0.055);
  --shadow: 0 30px 80px rgba(0, 0, 0, 0.34);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--zh);
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── 底板：与 .dsu-plate 同配方 ───────────────────────────────────────── */
.hos-plate {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    var(--brush),
    radial-gradient(120% 90% at 78% 12%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 55%),
    linear-gradient(168deg, var(--bg-2) 0%, var(--bg) 42%, var(--bg) 100%);
  background-size: 420px 420px, auto, auto;
  background-blend-mode: overlay, normal, normal;
}
:root[data-theme="dark"] .hos-plate {
  background:
    var(--brush),
    radial-gradient(90% 70% at 50% 46%, rgba(40, 70, 86, 0.32) 0%, rgba(0, 0, 0, 0) 62%),
    linear-gradient(168deg, var(--bg-2) 0%, var(--bg) 46%, #05070a 100%);
  background-size: 420px 420px, auto, auto;
  background-blend-mode: overlay, normal, normal;
}
/* 远景竖向档案柱：启动页 .dsu-wm 的那几根，留在主界面当景深 */
.hos-wm { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.hos-wm i {
  position: absolute; top: 2%; height: 96%;
  background: linear-gradient(180deg, rgba(255,255,255,0.0), rgba(255,255,255,0.38) 30%, rgba(255,255,255,0.14) 80%, rgba(255,255,255,0));
  filter: blur(1.4px);
}
:root[data-theme="dark"] .hos-wm i { background: linear-gradient(180deg, rgba(120,170,190,0), rgba(120,170,190,0.05) 35%, rgba(120,170,190,0)); }
.hos-wm i:nth-child(1) { left: 60%; width: 16%; opacity: .32; }
.hos-wm i:nth-child(2) { left: 78%; width: 16%; opacity: .5; }

/* ── 机框：与 .dsu-frame 同坐标 ──────────────────────────────────────── */
.hos-frame { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
.hos-frame::before {
  content: ""; position: absolute; inset: var(--frame);
  border: 1px solid var(--hair);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 0 rgba(0,0,0,0.3);
}
.hos-corner { position: absolute; width: 26px; height: 26px; }
.hos-corner::before, .hos-corner::after { content: ""; position: absolute; background: var(--ink); opacity: .62; }
.hos-corner::before { width: 100%; height: 1px; }
.hos-corner::after { width: 1px; height: 100%; }
.c-tl { left: var(--frame); top: var(--frame); } .c-tl::before, .c-tl::after { left: 0; top: 0; }
.c-tr { right: var(--frame); top: var(--frame); } .c-tr::before, .c-tr::after { right: 0; top: 0; }
.c-bl { left: var(--frame); bottom: var(--frame); } .c-bl::before, .c-bl::after { left: 0; bottom: 0; }
.c-br { right: var(--frame); bottom: var(--frame); } .c-br::before, .c-br::after { right: 0; bottom: 0; }

/* ── 入场：沿用启动页「左侧 -22px 滑入 / 右侧 +18px 滑入，60ms 一档」 ── */
[data-in] {
  opacity: 0;
  transition: opacity 560ms var(--ease), transform 560ms var(--ease);
  transition-delay: calc(var(--d, 0) * 60ms);
}
[data-in="l"] { transform: translateX(-22px); }
[data-in="r"] { transform: translateX(18px); }
[data-in="u"] { transform: translateY(14px); }
[data-in="f"] { transform: none; }
body.is-ready [data-in] { opacity: 1; transform: none; }

/* ── 外壳 ───────────────────────────────────────────────────────────── */
.hos-shell {
  position: fixed; inset: var(--frame); z-index: 2;
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr) var(--dock-w, 0px);
}

/* ── 侧栏 ───────────────────────────────────────────────────────────── */
/* 揭幕时侧栏要宽到能放下启动页那行 REV 读数；读数收起后收窄到常规宽度 */
.hos-shell { transition: grid-template-columns 680ms var(--ease); }
body.is-docked { --side-w: 280px; }
body.side-collapsed .hos-shell { grid-template-columns: 0px minmax(0, 1fr) var(--dock-w, 0px); }
.hos-side {
  position: relative;
  display: flex; flex-direction: column;
  min-height: 0; min-width: 0;
  border-right: 1px solid var(--hair);
  background: linear-gradient(180deg, color-mix(in srgb, var(--glass) 70%, transparent), color-mix(in srgb, var(--glass) 30%, transparent));
}
body.side-collapsed .hos-side { visibility: hidden; overflow: hidden; border-right-color: transparent; }

/* 品牌块与启动页 .dsu-brand 同位（视口 46/44 → 外壳内 20/18），装配完成后缩成 logo */
.hos-brand {
  position: absolute; left: 20px; top: 18px; z-index: 2;
  font-family: var(--din); color: var(--ink); line-height: 1;
  transform-origin: 0 0;
  transition: transform 720ms var(--ease);
}
.hos-brand .b1 { font-size: 33px; font-weight: 700; letter-spacing: .012em; line-height: .98; }
.hos-brand .b2 { font-size: 15px; font-weight: 700; letter-spacing: .012em; margin-top: 3px; }
.hos-brand .b3 { font-size: 30px; font-weight: 400; line-height: 1.06; letter-spacing: .012em; display: flex; gap: 9px; align-items: baseline; }
.hos-brand .b3 b { font-weight: 700; }
body.is-docked .hos-brand { transform: scale(.56); }
.side-toggle { position: absolute; right: 12px; top: 28px; z-index: 2; }

/* 开机读数：只在揭幕那一刻接住启动页，随后收起 */
.hos-boot { transition: opacity 360ms ease, transform 420ms var(--ease), visibility 0s linear 0s; }
body.is-docked .hos-boot { opacity: 0; transform: translateX(-14px); visibility: hidden; transition: opacity 360ms ease, transform 420ms var(--ease), visibility 0s linear 420ms; }
.hos-meta {
  position: absolute; left: 20px; top: 144px;
  display: flex; gap: 10px; align-items: baseline; white-space: nowrap;
  font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--muted);
}
.hos-meta .clock { color: var(--accent); font-variant-numeric: tabular-nums; }
.hos-slats { position: absolute; left: 20px; top: 170px; display: flex; gap: 5px; align-items: center; }
.hos-slats i { width: 20px; height: 2px; background: var(--ink); opacity: .3; }
.hos-slats i.on { width: 34px; background: var(--accent); opacity: 1; }

.hos-side-body {
  margin-top: 178px;
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  padding: 0 12px 0 20px;
  transition: margin-top 680ms var(--ease);
}
body.is-docked .hos-side-body { margin-top: 82px; }

/* 新会话：启动页 .dsu-btn 的擦入按钮 */
.hos-btn {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px;
  border: 1px solid color-mix(in srgb, var(--ink) 72%, transparent);
  background: color-mix(in srgb, var(--bg) 18%, transparent);
  font-family: var(--zh); font-weight: 500; font-size: 14px; letter-spacing: .08em;
  transition: color 220ms ease;
}
.hos-btn::before { content: ""; position: absolute; inset: 0; background: var(--ink); transform: translateX(-101%); transition: transform 300ms cubic-bezier(.2,.9,.2,1); }
.hos-btn:hover::before, .hos-btn:focus-visible::before { transform: none; }
.hos-btn:hover, .hos-btn:focus-visible { color: var(--box-ink); }
.hos-btn > * { position: relative; z-index: 1; }
.hos-btn:active { transform: translateY(1px); }

.icon-btn { display: inline-grid; place-items: center; width: 26px; height: 26px; color: var(--ink-soft); transition: background-color 160ms, color 160ms; }
.icon-btn:hover, .icon-btn[aria-pressed="true"] { background: var(--hair-soft); color: var(--ink); }

/* 插件 / 插件市场 / 自动化任务 */
.hos-nav { margin-top: 10px; display: flex; flex-direction: column; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 6px; font-size: 13.5px; color: var(--ink-soft); text-align: left;
  transition: background-color 160ms, color 160ms;
}
.nav-item:hover { background: var(--hair-soft); color: var(--ink); }
.nav-item .n { margin-left: auto; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--muted); }

.hos-sec-h {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px; padding: 10px 0 4px 6px; border-top: 1px solid var(--hair);
  font-size: 12px; letter-spacing: .12em; color: var(--muted);
}
.hos-sec-h .acts { display: flex; gap: 2px; }
.hos-search {
  display: none; align-items: center; gap: 8px;
  margin: 2px 0 4px; padding: 6px 2px 6px 6px;
  border-bottom: 1px solid var(--hair);
  color: var(--muted);
}
.hos-search.open { display: flex; }
.hos-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; font-size: 12.5px; color: var(--ink); }
.hos-search input::placeholder { color: var(--muted); }
.hos-search input::-webkit-search-cancel-button { display: none; }

.hos-tree { flex: 1; min-height: 0; overflow: auto; margin: 2px -6px 0 0; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--hair) transparent; }
.ws-row {
  width: 100%; display: grid; grid-template-columns: 18px 1fr 12px; align-items: center; gap: 8px;
  padding: 7px 6px; text-align: left; color: var(--ink-soft);
  transition: background-color 160ms, color 160ms;
}
.ws-row:hover { background: var(--hair-soft); color: var(--ink); }
.ws-name { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-chev { color: var(--muted); opacity: 0; transition: transform 240ms var(--ease), opacity 160ms; }
.ws-row:hover .ws-chev, .ws.open .ws-chev { opacity: 1; }
.ws.open .ws-chev { transform: rotate(90deg); }
.ws-list { display: none; padding: 0 0 6px 26px; }
.ws.open .ws-list { display: block; }
.sess {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline;
  padding: 6px 8px; text-align: left; font-size: 13px; color: var(--ink-soft);
  transition: background-color 160ms, color 160ms;
}
.sess span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess time { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--muted); }
.sess:hover { background: var(--hair-soft); color: var(--ink); }
/* 当前会话：启动页终幕「DEEPSEEK HARNESS」那块黑底白字 */
.sess[aria-current="true"] { background: var(--box-bg); color: var(--box-ink); }
.sess[aria-current="true"] time { color: color-mix(in srgb, var(--box-ink) 60%, transparent); }
.sess.is-running time { color: var(--accent); }
.tree-empty { padding: 10px 6px; font-size: 12.5px; color: var(--muted); }

/* 账户行 + 菜单 */
.hos-side-foot { position: relative; padding: 10px 12px 16px 14px; }
.acct {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 7px 8px; text-align: left; font-size: 13px; color: var(--ink);
  border: 1px solid transparent;
  transition: background-color 160ms, border-color 160ms;
}
.acct:hover, .acct[aria-expanded="true"] { background: var(--hair-soft); border-color: var(--hair); }
.acct .av { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--hair); color: var(--muted); }
.acct .ph { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; }
/* 首帧不播过渡（不放启动页时直接停在收起态） */
body.instant *, body.instant *::before, body.instant *::after,
html.no-motion *, html.no-motion *::before, html.no-motion *::after { transition: none !important; }
html.no-motion .dpane.on, html.no-motion .tool, html.no-motion .set-body > .in, html.no-motion .toast, html.no-motion .approve { animation: none !important; }

/* ── 中央列 ─────────────────────────────────────────────────────────── */
.hos-center { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.hos-top {
  height: 58px; flex: none;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 28px; border-bottom: 1px solid transparent;
  transition: border-color 400ms ease;
}
body[data-phase="active"] .hos-top { border-bottom-color: var(--hair); }
.hos-top-t { min-width: 0; display: flex; align-items: baseline; gap: 14px; opacity: 0; transform: translateY(-6px); transition: opacity 420ms var(--ease), transform 420ms var(--ease); }
body[data-phase="active"] .hos-top-t { opacity: 1; transform: none; }
.hos-top-t h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hos-top-t .m { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--muted); white-space: nowrap; }
.hos-top-a { display: flex; gap: 2px; align-items: center; }
.menu-btn { display: none; }
body.side-collapsed .menu-btn { display: inline-grid; }

.hos-stage { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* hero：启动页中央读数的版式 —— 大字中文 + 等宽拉开的英文 + 发丝分隔 */
.hos-hero {
  position: absolute; inset: 0 0 auto 0; top: 4%; height: 58%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
  transition: opacity 520ms var(--ease), transform 620ms var(--ease);
}
body[data-phase="active"] .hos-hero { opacity: 0; transform: translateY(-40px) scale(.96); }
.hos-reticle {
  position: absolute; left: 50%; top: 50%;
  width: min(440px, 62vh, 70%); aspect-ratio: 1;
  transform: translate(-50%, -50%);
  color: var(--ink);
  opacity: 0;
}
body.is-ready .hos-reticle { opacity: 1; }
.hos-reticle.docking { transition: transform 1150ms cubic-bezier(.22,.8,.2,1), opacity 900ms ease; }
.hos-reticle svg { width: 100%; height: 100%; overflow: visible; }
.r-ring-a { fill: none; stroke: currentColor; stroke-width: 1.6; opacity: .62; }
.r-ring-b { fill: none; stroke: currentColor; stroke-width: 1; opacity: .3; }
.r-bracket { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .55; }
.r-tick { stroke: currentColor; stroke-width: 1; opacity: .22; }
.r-tick.major { opacity: .42; stroke-width: 1.4; }
.r-data { stroke: var(--accent-2); stroke-width: 1.4; opacity: .25; }
.r-data.lit { opacity: .85; }
.r-dot-a { fill: currentColor; }
.r-dot-o { fill: var(--accent); }
.r-comet { fill: none; stroke: var(--accent-2); stroke-width: 2.2; stroke-linecap: round; opacity: .7; transform-origin: 200px 200px; animation: r-spin 7.5s linear infinite; }
.r-rot-a { transform-origin: 200px 200px; animation: r-spin 90s linear infinite; }
.r-rot-b { transform-origin: 200px 200px; animation: r-spin 60s linear infinite reverse; }
@keyframes r-spin { to { transform: rotate(360deg); } }

.hero-zh {
  position: relative; z-index: 1;
  font-family: var(--zh); font-weight: 500;
  font-size: clamp(34px, 4.4vh, 50px); letter-spacing: .3em; text-indent: .3em;
  color: var(--ink);
  text-shadow: 0 0 14px var(--halo), 0 0 5px var(--halo);
  white-space: nowrap;
}
.hero-en {
  position: relative; z-index: 1; margin-top: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .62em; text-indent: .62em;
  color: var(--ink-soft);
  text-shadow: 0 0 10px var(--halo);
}
.hero-rule { position: relative; z-index: 1; width: min(520px, 80%); height: 1px; margin-top: 10px; background: linear-gradient(90deg, transparent, var(--hair) 18%, var(--hair) 82%, transparent); }

/* 对话流 */
.hos-flow {
  flex: 1; min-height: 0; overflow: auto;
  padding: 28px 28px 24px;
  scrollbar-width: thin; scrollbar-color: var(--hair) transparent;
  display: none;
}
body[data-phase="active"] .hos-flow { display: block; }
.flow-in { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }

.e-head {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--muted);
}
.e-head b { color: var(--ink); font-weight: 400; }
.e-head .sep { width: 18px; height: 1px; background: var(--hair); }
.e-user { align-self: flex-end; max-width: 78%; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.e-user .bubble {
  padding: 12px 16px;
  background: var(--glass); border: 1px solid var(--hair);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  font-size: 14.5px; line-height: 1.75; color: var(--ink);
  box-shadow: inset 0 1px 0 var(--glass-hi);
}
.e-ai { display: flex; flex-direction: column; gap: 12px; }
.e-ai .e-head .mark { width: 7px; height: 7px; background: var(--ink); transform: rotate(45deg); }
.e-ai.running .e-head .mark { background: var(--accent); animation: blink 1.1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }

.think {
  display: flex; flex-direction: column;
}
.think-t {
  display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
  font-size: 12.5px; color: var(--ink-soft); padding: 2px 0;
}
.think-t .en { font-family: var(--mono); font-size: 9.5px; letter-spacing: .26em; color: var(--muted); }
.think-t svg { transition: transform 240ms var(--ease); color: var(--muted); }
.think.open .think-t svg { transform: rotate(90deg); }
.think-b { display: none; margin: 8px 0 0 5px; padding: 2px 0 2px 16px; border-left: 1px dashed var(--hair); font-size: 13px; line-height: 1.8; color: var(--muted); }
.think.open .think-b { display: block; }

.tools { display: flex; flex-direction: column; border-top: 1px solid var(--hair-soft); }
.tool {
  display: grid; grid-template-columns: 16px 62px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 8px 2px; border-bottom: 1px solid var(--hair-soft);
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em;
  animation: tool-in 420ms var(--ease) both;
}
@keyframes tool-in { from { opacity: 0; transform: translateX(-12px); } }
.tool .st { width: 7px; height: 7px; border: 1px solid var(--muted); border-radius: 50%; justify-self: center; }
.tool.done .st { background: var(--ink); border-color: var(--ink); border-radius: 0; transform: rotate(45deg); width: 6px; height: 6px; }
.tool.run .st { border-color: var(--accent); background: var(--accent); animation: blink 1.1s steps(2) infinite; }
.tool .vb { font-size: 10px; letter-spacing: .22em; color: var(--muted); }
.tool .tg { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .rt { font-size: 10px; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
.tool .rt .add { color: var(--accent-2); } .tool .rt .del { color: var(--glitch-a); }
.tool.run .rt { color: var(--accent-ink); }

.prose { font-size: 14.5px; line-height: 1.85; color: var(--ink); }
.prose p { margin: 0 0 10px; }
.prose ul { margin: 0 0 10px; padding-left: 0; list-style: none; }
.prose li { position: relative; padding-left: 18px; margin: 4px 0; }
.prose li::before { content: ""; position: absolute; left: 3px; top: .85em; width: 6px; height: 1px; background: var(--ink); }
.prose code { font-family: var(--mono); font-size: 12px; padding: 1px 5px; background: var(--hair-soft); border: 1px solid var(--hair-soft); }
.codeblock { margin: 4px 0 12px; border: 1px solid var(--hair); background: color-mix(in srgb, var(--glass) 80%, transparent); }
.codeblock .ch { display: flex; justify-content: space-between; padding: 6px 12px; border-bottom: 1px solid var(--hair-soft); font-family: var(--mono); font-size: 9.5px; letter-spacing: .22em; color: var(--muted); }
.codeblock pre { margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.7; color: var(--ink-soft); overflow: auto; }
.codeblock .k { color: var(--accent-ink); } .codeblock .s { color: var(--accent-2); } .codeblock .c { color: var(--muted); }
.caret { display: inline-block; width: 8px; height: 1.05em; vertical-align: -2px; margin-left: 2px; background: var(--accent); animation: blink 1s steps(2) infinite; }

.exec {
  display: flex; align-items: center; gap: 12px; margin-top: 2px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .3em; color: var(--muted);
}
.exec .zh { font-family: var(--zh); letter-spacing: .3em; font-size: 12px; color: var(--ink-soft); }
.exec svg { width: 22px; height: 22px; }
.exec .ring { fill: none; stroke: var(--hair); stroke-width: 2; }
.exec .arc { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; transform-origin: 12px 12px; animation: r-spin 1.2s linear infinite; }
.exec .t { color: var(--accent-ink); font-variant-numeric: tabular-nums; }

/* 输入卡 */
.hos-seat { position: relative; flex: none; padding: 0 28px 22px; }
body[data-phase="hero"] .hos-seat { position: absolute; left: 0; right: 0; top: 62%; }
.composer {
  position: relative; max-width: 780px; margin: 0 auto;
  border: 1px solid var(--hair);
  background: linear-gradient(180deg, var(--glass-hi), transparent 48%), var(--glass);
  -webkit-backdrop-filter: blur(15px) saturate(1.18); backdrop-filter: blur(15px) saturate(1.18);
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
  box-shadow: var(--shadow);
  transition: border-color 220ms ease;
}
/* clip-path 切掉的角补一道发丝斜线，框才闭合 */
.cut::before, .cut::after { content: ""; position: absolute; width: var(--cut, 16px); height: var(--cut, 16px); pointer-events: none;
  background: linear-gradient(to top right, transparent calc(50% - 1px), var(--hair) calc(50% - 1px), var(--hair) calc(50% + .5px), transparent calc(50% + .5px)); }
.cut::before { top: -1px; right: -1px; }
.cut::after { bottom: -1px; left: -1px; }
.cut.cut-tr::after { display: none; }
.composer:focus-within { border-color: color-mix(in srgb, var(--ink) 45%, transparent); }
.cmp-chips { display: flex; gap: 6px; padding: 10px 12px 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px;
  border: 1px solid var(--hair-soft); background: var(--hair-soft);
  font-size: 12px; color: var(--ink-soft);
  transition: border-color 160ms, color 160ms;
}
.chip:hover { border-color: var(--hair); color: var(--ink); }
.chip .en { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--muted); }
.chip svg.i { width: 12px; height: 12px; }
.cmp-in { display: block; width: 100%; min-height: 58px; max-height: 220px; padding: 10px 16px 4px; border: 0; background: none; outline: none; resize: none; font: inherit; font-size: 14.5px; line-height: 1.7; color: var(--ink); }
.cmp-in::placeholder { color: var(--muted); }
.cmp-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px 10px 10px; }
.cmp-bar .l, .cmp-bar .r { display: flex; align-items: center; gap: 4px; }
.model { display: inline-flex; align-items: baseline; gap: 8px; height: 30px; padding: 0 8px; align-items: center; font-family: var(--din); font-size: 13.5px; letter-spacing: .04em; color: var(--ink); transition: background-color 160ms; }
.model:hover { background: var(--hair-soft); }
.model .lv { font-family: var(--mono); font-size: 9.5px; letter-spacing: .22em; color: var(--accent-ink); }
.send {
  display: grid; place-items: center; width: 36px; height: 36px; margin-left: 4px;
  background: var(--ink); color: var(--box-ink);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
  transition: background-color 200ms, opacity 200ms;
}
.send:hover { background: var(--accent); color: #fff; }
.send:disabled { opacity: .28; cursor: default; background: var(--ink); color: var(--box-ink); }
.send.stop { background: var(--accent); color: #fff; opacity: 1; cursor: pointer; }
.send svg.i { width: 16px; height: 16px; stroke-width: 2; }
.cmp-note { max-width: 780px; margin: 8px auto 0; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; color: var(--muted); }

/* 信号轨迹：启动页底部那条，运行时振幅抬高 */
.hos-trace { width: min(520px, 70%); height: 38px; margin: 18px auto 0; opacity: .74; pointer-events: none; }
body[data-phase="active"] .hos-trace { display: none; }
.hos-trace svg { width: 100%; height: 100%; overflow: visible; }
.t-base { stroke: var(--hair); stroke-width: 1; } .t-tick { stroke: var(--hair); stroke-width: 1; opacity: .7; }
.t-line { fill: none; stroke: var(--accent-2); stroke-width: 1.25; stroke-linejoin: round; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--accent-2) 50%, transparent)); }
.t-cur { stroke: var(--accent); stroke-width: 1; animation: t-scan 4.6s linear infinite; }
@keyframes t-scan { from { transform: translateX(0); } to { transform: translateX(520px); } }

/* ── 右侧栏：DSH 的停靠列。不是浮起的卡片，是机框里的一列；顶边就是 tab 条 ── */
.hos-dock {
  position: relative; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  border-left: 1px solid var(--hair);
  background: linear-gradient(180deg, color-mix(in srgb, var(--glass) 55%, transparent), color-mix(in srgb, var(--glass) 22%, transparent));
  overflow: hidden;
  transition: visibility 0s linear 0s;
}
body:not(.dock-open) .hos-dock { visibility: hidden; border-left-color: transparent; transition: visibility 0s linear 680ms; }
.dock-in { position: absolute; inset: 0 auto 0 0; width: var(--dock-open-w); display: flex; flex-direction: column; }
.dock-strip {
  height: 58px; flex: none;
  display: flex; align-items: center; gap: 2px;
  padding: 0 10px 0 12px; border-bottom: 1px solid var(--hair);
}
.dtabs { display: flex; gap: 4px; min-width: 0; overflow: hidden; }
.dtab {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; max-width: 168px; flex: none;
  padding: 0 4px 0 9px; font-size: 12.5px; color: var(--ink-soft);
  border: 1px solid var(--hair-soft);
  transition: background-color 160ms, color 160ms, border-color 160ms;
}
.dtab:hover { border-color: var(--hair); color: var(--ink); }
.dtab .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dtab svg.i { width: 13px; height: 13px; }
.dtab .x { display: inline-grid; place-items: center; width: 18px; height: 18px; color: inherit; opacity: 0; }
.dtab:hover .x, .dtab.on .x { opacity: .7; }
.dtab .x:hover { opacity: 1; background: color-mix(in srgb, currentColor 14%, transparent); }
.dtab.on { background: var(--box-bg); color: var(--box-ink); border-color: var(--box-bg); }
.dtab.quiet .x { display: none; }
.dtab.quiet { padding-right: 9px; }
.dock-strip .sp { flex: 1; }
.dock-body { position: relative; flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--hair) transparent; }
.dpane { display: none; min-height: 100%; }
.dpane.on { display: block; animation: pane-in 260ms var(--ease) both; }
@keyframes pane-in { from { opacity: 0; transform: translateY(6px); } }

/* 引导页：DSH 的「弱化罗盘 + 入口胶囊」，罗盘就是启动页的准星 */
.guide { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 40px 24px; }
.guide-compass { width: 132px; aspect-ratio: 1; color: var(--ink); opacity: .55; }
.guide-compass svg { width: 100%; height: 100%; overflow: visible; }
.g-list { width: min(320px, 100%); display: flex; flex-direction: column; gap: 8px; }
.g-entry {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center;
  padding: 12px 14px; text-align: left;
  border: 1px solid var(--hair); background: color-mix(in srgb, var(--glass) 70%, transparent);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  transition: color 220ms ease, border-color 220ms;
}
.g-entry::before { content: ""; position: absolute; inset: 0; background: var(--ink); transform: translateX(-101%); transition: transform 300ms cubic-bezier(.2,.9,.2,1); }
.g-entry:hover::before, .g-entry:focus-visible::before { transform: none; }
.g-entry:hover, .g-entry:focus-visible { color: var(--box-ink); border-color: var(--ink); }
.g-entry > * { position: relative; z-index: 1; }
.g-entry b { display: block; font-weight: 500; font-size: 13.5px; }
.g-entry small { display: block; font-size: 11.5px; color: var(--muted); transition: color 220ms; }
.g-entry:hover small, .g-entry:focus-visible small { color: color-mix(in srgb, var(--box-ink) 62%, transparent); }
.g-entry kbd { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--muted); }
.g-entry:hover kbd { color: inherit; opacity: .7; }

/* 页头行（文件树 / 对比 / 终端共用） */
.p-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--hair-soft); background: color-mix(in srgb, var(--bg-2) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.p-head .grow { flex: 1; min-width: 0; }
.path { font-family: var(--mono); font-size: 11.5px; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.path span { direction: ltr; unicode-bidi: isolate; }
.path .dim { color: var(--muted); } .path .cur { color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--hair); }
.seg button { height: 24px; padding: 0 8px; font-size: 11.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--hair-soft); color: var(--ink); }

/* 文件树 */
.ftree { padding: 6px 6px 18px; }
.frow { width: 100%; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 calc(8px + var(--lv, 0) * 14px); text-align: left; font-size: 13px; color: var(--ink-soft); transition: background-color 140ms, color 140ms; }
.frow:hover { background: var(--hair-soft); color: var(--ink); }
.frow svg.i { width: 13px; height: 13px; color: var(--muted); }
.frow .chev { transition: transform 200ms var(--ease); }
.frow.open .chev { transform: rotate(90deg); }
.frow .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow .st { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; }
.frow .st.m { color: var(--accent-ink); } .frow .st.a { color: var(--accent-2); }
.frow .pad { width: 13px; flex: none; }

/* 变更对比 */
.rv-pick { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-width: 0; height: 28px; padding: 0 6px; transition: background-color 140ms; }
.rv-pick:hover { background: var(--hair-soft); }
.rv-pick .path { max-width: 220px; }
.num { font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; white-space: nowrap; }
.num .add { color: var(--accent-2); } .num .del { color: var(--glitch-a); }
.diff { font-family: var(--mono); font-size: 11.5px; line-height: 1.75; padding: 8px 0 24px; }
.diff .hk { padding: 6px 14px 4px; color: var(--muted); font-size: 10.5px; letter-spacing: .06em; }
.dl { display: grid; grid-template-columns: 38px 38px 14px minmax(0, 1fr); }
.dl .ln { padding-right: 8px; text-align: right; color: var(--muted); opacity: .7; user-select: none; }
.dl .sg { color: var(--muted); user-select: none; }
.dl code { font-family: inherit; white-space: pre; overflow: hidden; text-overflow: ellipsis; color: var(--ink-soft); padding-right: 12px; }
.diff.wrap .dl code { white-space: pre-wrap; word-break: break-all; }
.dl.add { background: color-mix(in srgb, var(--accent-2) 10%, transparent); } .dl.add .sg { color: var(--accent-2); }
.dl.del { background: color-mix(in srgb, var(--glitch-a) 9%, transparent); } .dl.del .sg { color: var(--glitch-a); }
.split { display: grid; grid-template-columns: 1fr 1fr; }
.split > div + div { border-left: 1px solid var(--hair-soft); }
.split .dl { grid-template-columns: 34px 12px minmax(0, 1fr); }
.split .dl.pad { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--hair-soft) 5px 6px); }
.rv-note { padding: 10px 14px 0; font-size: 12px; color: var(--muted); }

/* 终端 */
.term { padding: 12px 16px 24px; font-family: var(--mono); font-size: 12px; line-height: 1.75; color: var(--ink-soft); white-space: pre-wrap; }
.term .pr { color: var(--accent-ink); } .term .ok { color: var(--accent-2); } .term .mu { color: var(--muted); }

/* 浏览器 */
.urlbar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: 1px solid var(--hair); font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }
.urlbar input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; color: var(--ink); }
.b-empty { padding: 60px 24px; text-align: center; font-size: 12.5px; color: var(--muted); }
.f-empty { padding: 60px 24px; text-align: center; font-size: 12.5px; color: var(--muted); }
.prev { padding: 12px 16px 24px; font-family: var(--mono); font-size: 12px; line-height: 1.75; color: var(--ink-soft); white-space: pre-wrap; }

/* ── 输入框上方的上下文堆栈：Todo（DSH 的顺序是 Todo → Goal → Queue） ── */
.cmp-stack { max-width: 780px; margin: 0 auto; padding: 0 18px; display: none; }
body[data-phase="active"] .cmp-stack.has { display: block; }
.todo-card {
  border: 1px solid var(--hair); border-bottom: 0;
  background: linear-gradient(180deg, var(--glass-hi), transparent 70%), var(--glass);
  -webkit-backdrop-filter: blur(15px); backdrop-filter: blur(15px);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
}
.todo-h { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto 14px; gap: 6px; align-items: center; padding: 7px 12px; text-align: left; font-size: 12.5px; color: var(--ink); }
.todo-h .bx, .todo .bx { font-family: var(--mono); font-size: 10px; color: var(--accent-ink); }
.todo-h .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.todo-h .c { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--muted); }
.todo-h svg { color: var(--muted); transition: transform 220ms var(--ease); }
.todo-card.open .todo-h svg { transform: rotate(180deg); }
.todo-list { display: none; padding: 0 12px 8px; border-top: 1px solid var(--hair-soft); }
.todo-card.open .todo-list { display: block; }
.todo { display: grid; grid-template-columns: 26px 1fr; gap: 6px; padding: 4px 0; font-size: 12.5px; color: var(--ink-soft); }
.todo .bx { color: var(--muted); }
.todo.done { color: var(--muted); } .todo.done span { text-decoration: line-through; text-decoration-color: var(--hair); }
.todo.doing { color: var(--ink); } .todo.doing .bx { color: var(--accent-ink); }

/* 输入卡里的上下文读数：启动页那 6 格阶段条，缩小后读上下文占用 */
.ctxm { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--muted); }
.ctxm .bars { display: flex; gap: 2px; }
.ctxm .bars i { width: 7px; height: 2px; background: var(--hair); }
.ctxm .bars i.on { background: var(--ink); opacity: .6; }
.ctxm .bars i.hi { background: var(--accent); opacity: 1; width: 11px; }

/* 一轮结束时的改动文件卡片：点行在右侧栏打开对比 */
.chg-card { position: relative; margin-top: 4px; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); border: 1px solid var(--hair); background: color-mix(in srgb, var(--glass) 75%, transparent); }
.chg-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; text-align: left; font-size: 13px; color: var(--ink); border-bottom: 1px solid var(--hair-soft); }
.chg-h .num { margin-left: auto; }
.chg-h .hint { margin-left: auto; display: none; font-size: 12px; color: var(--muted); }
.chg-h:hover .num { display: none; } .chg-h:hover .hint { display: inline; }
.chg-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 14px; text-align: left; transition: background-color 140ms; }
.chg-row:hover { background: var(--hair-soft); }
.chg-row .path { flex: 1; min-width: 0; font-family: var(--zh); font-size: 12.5px; }

/* 侧栏底部的伪代码状态：原来右轨 SELF-CHECK 的读数，压成三行 */
.sys { margin: 0 2px 8px 8px; padding-top: 10px; border-top: 1px dashed var(--hair); font-family: var(--mono); font-size: 10px; line-height: 1.75; letter-spacing: .04em; color: var(--muted); white-space: nowrap; overflow: hidden; }
.sys .r { display: flex; gap: 8px; }
.sys .k { color: var(--accent-ink); }
.sys .clk { margin-left: auto; color: var(--accent); font-variant-numeric: tabular-nums; }
.sys .v { color: var(--ink-soft); }
.sys .dot { display: inline-block; width: 5px; height: 5px; margin-right: 6px; vertical-align: 1px; background: var(--accent-2); }
.sys.busy .dot { background: var(--accent); animation: blink 1.1s steps(2) infinite; }
.sys .cmd { overflow: hidden; text-overflow: ellipsis; }

/* 全屏：覆盖机框内侧，底层列宽不变 */
body.dock-full .hos-dock { position: fixed; inset: var(--frame); z-index: 30; visibility: visible; background: var(--bg-2); }
body.dock-full .dock-in { width: 100%; }
body.dock-open #dockToggle { display: none; }
body.dock-open .hos-foot, body[data-phase="active"] .hos-foot { opacity: 0; }
[hidden] { display: none !important; }
.hos-foot { transition: opacity 300ms ease; }

/* 页脚：与 .dsu-foot 同位 */
.hos-foot {
  position: fixed; right: var(--pad); bottom: 52px; z-index: 4;
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--ink);
  pointer-events: none;
}
.hos-foot i { width: 26px; height: 7px; background: var(--ink); }

/* 揭幕瞬间的一次扫描线，与启动页 .dsu-scanline 同配方 */
.hos-scan { position: fixed; left: 0; right: 0; top: -14%; height: 96px; z-index: 5; pointer-events: none; opacity: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.035) 58%, rgba(0,0,0,.08) 86%, rgba(0,0,0,.12) 97%, rgba(0,0,0,0) 100%); }
:root[data-theme="dark"] .hos-scan { background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.04) 58%, rgba(255,255,255,.09) 86%, rgba(255,255,255,.14) 97%, rgba(255,255,255,0) 100%); }
.hos-scan.go { animation: scan 2200ms cubic-bezier(.42,0,.58,1) 1; }
@keyframes scan { 0% { top: -14%; opacity: 0; } 10% { opacity: 1; } 86% { opacity: 1; } 100% { top: 102%; opacity: 0; } }

/* ── demo 控制条（不属于皮肤）────────────────────────────────────────── */
.demo-bar {
  position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 2147483600;
  display: flex; align-items: center; gap: 2px; padding: 3px;
  background: rgba(14, 15, 18, .86); color: #e9e9ec;
  font-family: var(--mono); font-size: 10px; letter-spacing: .16em;

}

.demo-bar button { padding: 4px 9px; color: #cfd0d6; }
.demo-bar button:hover { background: rgba(255,255,255,.1); color: #fff; }

/* ── 响应式 ─────────────────────────────────────────────────────────── */
@media (max-width: 1180px) {
  body.dock-open .hos-foot { display: none; }
}
@media (max-width: 760px) {
  :root { --frame: 10px; }
  .hos-shell, body[data-phase="hero"] .hos-shell { grid-template-columns: minmax(0, 1fr); }
  body.dock-open { --dock-w: 0px; }
  body.dock-open .hos-dock { position: fixed; inset: var(--frame); z-index: 30; visibility: visible; background: var(--bg-2); }
  .dock-in { width: 100%; }
  .cmp-stack { padding: 0 8px; }
  .hos-side {
    position: fixed; z-index: 20; left: var(--frame); top: var(--frame); bottom: var(--frame); width: min(300px, 86vw);
    background: var(--bg-2); transform: translateX(-110%); visibility: hidden; overflow: hidden;
    transition: transform 380ms var(--ease), visibility 0s linear 380ms;
  }
  body.side-open .hos-side { transform: none; visibility: visible; box-shadow: var(--shadow); transition: transform 380ms var(--ease); }
  .hos-top-t { flex: 1; }
  .hos-top-t .m { display: none; }
  .menu-btn { display: inline-grid; }
  .hos-top { padding: 0 12px; }
  .hos-top-t { opacity: 1; transform: none; }
  body[data-phase="hero"] .hos-top-t h1 { font-family: var(--din); font-weight: 700; letter-spacing: .06em; }
  .hos-seat { padding: 0 12px 14px; }
  body[data-phase="hero"] .hos-seat { top: auto; bottom: 0; }
  .hos-hero { top: 0; height: 64%; }
  .hero-zh { font-size: 28px; letter-spacing: .22em; text-indent: .22em; }
  .hero-en { font-size: 9.5px; letter-spacing: .4em; text-indent: .4em; }
  .hos-trace, .hos-foot, .cmp-note { display: none; }
  .hos-flow { padding: 18px 12px; }
  .e-user { max-width: 92%; }
  .tool { grid-template-columns: 14px 48px minmax(0,1fr); }
  .tool .rt { display: none; }
  .demo-bar { bottom: auto; top: 0; white-space: nowrap; font-size: 9px; letter-spacing: .08em; }
  .demo-bar button { padding: 2px 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
}
/* ══ 统一浮层体系：弹出菜单 / 提示 / 轻提示 / 确认框 / 设置页 ═══════════════
   全部沿用启动页的语言：发丝边、切角、深色反白块做「当前」，橙色只给状态。 */
:root { --dock-open-w: clamp(340px, 40vw, 600px); }
body.dock-open { --dock-w: var(--dock-open-w); }

/* —— 拖动调宽 —— */
.rz { position: absolute; top: 0; bottom: 0; z-index: 6; width: 9px; cursor: col-resize; touch-action: none; }
.rz::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: transparent; transition: background-color 160ms; }
.rz:hover::after, .rz:focus-visible::after, body.resizing .rz.on::after { background: var(--accent); }
.rz:focus-visible { outline: none; }
.rz-l { right: -5px; }
.rz-r { left: -4px; }
body:not(.is-docked) .rz-l, body.side-collapsed .rz-l, body.dock-full .rz-r { display: none; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing .hos-shell, body.resizing .hos-side-body, body.resizing .hos-brand { transition: none !important; }
body.resizing iframe { pointer-events: none; }

/* —— 弹出菜单：外层投影，内层切角 —— */
.pop { position: fixed; z-index: 2147483300; filter: drop-shadow(0 18px 40px rgba(20, 16, 10, .16)); opacity: 0; transform: translateY(4px); transition: opacity 140ms ease, transform 200ms var(--ease); pointer-events: none; }
:root[data-theme="dark"] .pop { filter: drop-shadow(0 22px 48px rgba(0, 0, 0, .5)); }
.pop.up { transform: translateY(-4px); }
.pop.open { opacity: 1; transform: none; pointer-events: auto; }
.pop-in {
  min-width: 220px; max-width: 340px; max-height: min(460px, 70vh); overflow: auto; padding: 5px;
  border: 1px solid var(--hair);
  background: linear-gradient(180deg, var(--glass-hi), transparent 60%), color-mix(in srgb, var(--bg-2) 96%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 0 100%);
  scrollbar-width: thin; scrollbar-color: var(--hair) transparent;
}
.pop-h { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px 5px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .22em; color: var(--muted); }
.pop-sep { height: 1px; margin: 4px 6px; background: var(--hair-soft); }
.pop-item {
  width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 7px 10px; text-align: left; font-size: 13px; color: var(--ink-soft);
  transition: background-color 120ms, color 120ms;
}
.pop-item svg.i { width: 14px; height: 14px; color: var(--muted); }
.pop-item:hover, .pop-item.kb { background: var(--hair-soft); color: var(--ink); }
.pop-item:hover svg.i, .pop-item.kb svg.i { color: var(--ink); }
.pop-item .tx { min-width: 0; }
.pop-item .tx b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop-item .tx small { display: block; margin-top: 1px; font-size: 11.5px; line-height: 1.5; color: var(--muted); white-space: normal; }
.pop-item kbd, .pop-item .aux { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--muted); }
.pop-item[aria-checked="true"] { color: var(--ink); }
.pop-item[aria-checked="true"] .ck { color: var(--accent-ink); }
.pop-item .ck { width: 14px; height: 14px; display: grid; place-items: center; }
.pop-item[aria-disabled="true"] { opacity: .5; cursor: default; background: none; }
.pop-item.danger, .pop-item.danger svg.i { color: var(--glitch-a); }
.pop-search { display: flex; align-items: center; gap: 8px; margin: 2px 4px 4px; padding: 6px 6px; border-bottom: 1px solid var(--hair); color: var(--muted); }
.pop-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; font-size: 12.5px; color: var(--ink); }
.pop-search input::-webkit-search-cancel-button { display: none; }
.pop-empty { padding: 10px; font-size: 12px; color: var(--muted); }
.pop-foot { padding: 6px 6px 4px; }
.pop .seg { width: 100%; display: flex; }
.pop .seg button { flex: 1; }

/* —— 悬停提示：反白小块，和「当前会话」同一块黑 —— */
.tip { position: fixed; z-index: 2147483400; display: flex; gap: 10px; align-items: center; padding: 4px 8px; background: var(--box-bg); color: var(--box-ink); font-size: 11.5px; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateY(2px); transition: opacity 120ms ease, transform 160ms var(--ease); }
.tip.on { opacity: 1; transform: none; }
.tip kbd { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; opacity: .62; }

/* —— 轻提示 —— */
.toasts { position: fixed; left: 50%; bottom: 46px; z-index: 2147483450; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 14px; padding: 9px 12px 9px 14px; background: var(--box-bg); color: var(--box-ink); font-size: 12.5px; pointer-events: auto; animation: toast-in 260ms var(--ease) both; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); }
.toast .lb { font-family: var(--mono); font-size: 9.5px; letter-spacing: .22em; color: var(--accent); }
.toast button { font-size: 12px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.toast.out { animation: toast-out 200ms ease forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }

/* —— 按钮 —— */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 14px; border: 1px solid color-mix(in srgb, var(--ink) 40%, transparent); font-size: 13px; color: var(--ink); transition: color 200ms, border-color 200ms, opacity 200ms; }
.btn::before { content: ""; position: absolute; inset: 0; background: var(--ink); transform: translateX(-101%); transition: transform 280ms cubic-bezier(.2,.9,.2,1); }
.btn:hover::before, .btn:focus-visible::before { transform: none; }
.btn:hover, .btn:focus-visible { color: var(--box-ink); border-color: var(--ink); }
.btn > * { position: relative; z-index: 1; }
.btn.primary { background: var(--ink); color: var(--box-ink); border-color: var(--ink); }
.btn.primary::before { background: var(--accent); }
.btn.primary:hover, .btn.primary:focus-visible { color: #fff; border-color: var(--accent); }
.btn.danger { background: var(--glitch-a); color: #fff; border-color: var(--glitch-a); }
.btn.danger::before { background: var(--ink); }
.btn.ghost { border-color: transparent; color: var(--ink-soft); }
.btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }
.btn:disabled { opacity: .4; pointer-events: none; }

/* —— 模态层：确认框与设置页共用 —— */
.modal { position: fixed; inset: 0; z-index: 2147483200; display: grid; place-items: center; padding: 24px; background: color-mix(in srgb, var(--bg) 52%, transparent); -webkit-backdrop-filter: blur(6px) saturate(.9); backdrop-filter: blur(6px) saturate(.9); opacity: 0; transition: opacity 200ms ease; }
.modal.open { opacity: 1; }
.plate {
  position: relative;
  border: 1px solid var(--hair);
  background:
    var(--brush),
    linear-gradient(168deg, var(--bg-2) 0%, var(--bg) 60%);
  background-size: 420px 420px, auto; background-blend-mode: overlay, normal;
  box-shadow: 0 40px 120px rgba(30, 24, 16, .22);
  transform: translateY(10px) scale(.985); transition: transform 320ms var(--ease);
}
:root[data-theme="dark"] .plate { box-shadow: 0 40px 120px rgba(0, 0, 0, .6); }
.modal.open .plate { transform: none; }
.plate .hos-corner { position: absolute; }
.plate .c-tl { left: -1px; top: -1px; } .plate .c-tr { right: -1px; top: -1px; } .plate .c-bl { left: -1px; bottom: -1px; } .plate .c-br { right: -1px; bottom: -1px; }
.dlg-plate { width: min(460px, 100%); }
.dlg { padding: 22px 24px 18px; }
.dlg-k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .26em; color: var(--accent-ink); }
.dlg h2 { margin: 8px 0 0; font-size: 17px; font-weight: 600; letter-spacing: .04em; }
.dlg p { margin: 10px 0 0; font-size: 13px; line-height: 1.8; color: var(--ink-soft); }
.dlg-chk { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; font-size: 12.5px; color: var(--ink-soft); cursor: pointer; }
.dlg-f { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

/* 方形复选 / 开关 / 单选 */
.box { flex: none; width: 14px; height: 14px; margin-top: 2px; border: 1px solid color-mix(in srgb, var(--ink) 50%, transparent); display: grid; place-items: center; }
.box::after { content: ""; width: 6px; height: 6px; background: var(--accent); transform: scale(0); transition: transform 160ms var(--ease); }
[aria-checked="true"] > .box::after, input:checked + .box::after { transform: none; }
.sw { position: relative; flex: none; width: 34px; height: 18px; border: 1px solid color-mix(in srgb, var(--ink) 45%, transparent); transition: background-color 180ms; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: color-mix(in srgb, var(--ink) 55%, transparent); transition: transform 220ms var(--ease), background-color 180ms; }
.sw[aria-checked="true"] { background: var(--ink); border-color: var(--ink); }
.sw[aria-checked="true"]::after { transform: translateX(16px); background: var(--accent); }

/* —— 设置页 —— */
.settings { width: min(1000px, 100%); height: min(700px, calc(100vh - 48px)); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.set-top { display: flex; align-items: baseline; gap: 14px; padding: 20px 22px 16px 26px; border-bottom: 1px solid var(--hair); }
.set-top h2 { white-space: nowrap; margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .14em; }
.set-top .en { font-family: var(--mono); font-size: 10px; letter-spacing: .4em; color: var(--muted); }
.set-top .sp { flex: 1; }
.set-top .ver { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: var(--muted); }
.set-main { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
.set-nav { min-height: 0; overflow: auto; padding: 12px 10px 16px 14px; border-right: 1px solid var(--hair); scrollbar-width: thin; }
.set-nav .g { margin: 12px 0 4px 10px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .24em; color: var(--muted); }
.set-nav .g:first-child { margin-top: 2px; }
.set-nav button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; text-align: left; font-size: 13px; color: var(--ink-soft); transition: background-color 140ms, color 140ms; }
.set-nav button:hover { background: var(--hair-soft); color: var(--ink); }
.set-nav button[aria-current="true"] { background: var(--box-bg); color: var(--box-ink); }
.set-nav button svg.i { width: 14px; height: 14px; opacity: .8; }
.set-nav .tag { margin-left: auto; font-family: var(--mono); font-size: 9px; letter-spacing: .14em; opacity: .6; }
.set-body { min-height: 0; overflow: auto; padding: 22px 30px 40px; scrollbar-width: thin; scrollbar-color: var(--hair) transparent; }
.set-body > .in { max-width: 640px; animation: pane-in 240ms var(--ease) both; }
.set-h h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .06em; }
.set-h p { margin: 6px 0 0; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
.set-grp { margin-top: 22px; }
.set-grp > .k { padding-bottom: 7px; border-bottom: 1px solid var(--hair); font-family: var(--mono); font-size: 9.5px; letter-spacing: .24em; color: var(--muted); }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--hair-soft); }
.set-row .l b { display: block; font-size: 13.5px; font-weight: 500; }
.set-row .l small { display: block; margin-top: 3px; font-size: 12px; line-height: 1.65; color: var(--muted); }
.set-row .l .ov { margin-left: 8px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--accent-ink); }
.set-row .r { display: flex; align-items: center; gap: 8px; }
.fld { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 2px; border-bottom: 1px solid var(--hair); }
.fld:focus-within { border-bottom-color: var(--ink); }
.fld input { width: 120px; border: 0; background: none; outline: none; font-family: var(--mono); font-size: 12.5px; color: var(--ink); text-align: right; }
.fld input.wide { width: 240px; text-align: left; }
.fld .u { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.pick { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 10px; border: 1px solid var(--hair); font-size: 12.5px; color: var(--ink); }
.pick:hover { border-color: color-mix(in srgb, var(--ink) 40%, transparent); }
.pick svg.i { width: 12px; height: 12px; color: var(--muted); }
.swatches { display: flex; gap: 6px; }
.swatches button { width: 22px; height: 22px; border: 1px solid var(--hair); display: grid; place-items: center; }
.swatches button i { width: 12px; height: 12px; }
.swatches button[aria-checked="true"] { border-color: var(--ink); }
.chip-st { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; padding: 2px 6px; border: 1px solid currentColor; white-space: nowrap; }
.chip-st.ok { color: var(--accent-2); } .chip-st.bad { color: var(--glitch-a); } .chip-st.mu { color: var(--muted); } .chip-st.on { color: var(--accent-ink); }
.prov { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair-soft); }
.prov .ic { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--hair); font-family: var(--din); font-weight: 700; font-size: 13px; }
.prov b { display: block; font-size: 13.5px; font-weight: 500; } .prov small { display: block; font-size: 12px; color: var(--muted); }
.opt-cards { display: grid; gap: 8px; margin-top: 12px; }
.opt-card { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; padding: 12px 14px; text-align: left; border: 1px solid var(--hair); transition: border-color 160ms, background-color 160ms; }
.opt-card:hover { border-color: color-mix(in srgb, var(--ink) 40%, transparent); }
.opt-card[aria-checked="true"] { border-color: var(--ink); background: color-mix(in srgb, var(--glass) 70%, transparent); }
.opt-card .box { border-radius: 50%; } .opt-card .box::after { border-radius: 50%; }
.opt-card b { display: block; font-size: 13.5px; font-weight: 500; } .opt-card small { display: block; margin-top: 3px; font-size: 12px; line-height: 1.65; color: var(--muted); }
.opt-card .exp { margin-left: 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--accent-ink); }
.plug { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--hair-soft); }
.plug b { display: block; font-family: var(--mono); font-size: 12.5px; font-weight: 400; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plug small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.set-search { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding: 6px 2px; border-bottom: 1px solid var(--hair); color: var(--muted); }
.set-search input { flex: 1; border: 0; background: none; outline: none; font: inherit; font-size: 13px; color: var(--ink); }
.set-note { margin-top: 14px; font-size: 12px; color: var(--muted); }
.set-actions { display: flex; gap: 8px; margin-top: 16px; }

/* —— 对话流细节 —— */
.tool { cursor: pointer; }
.tool:hover { background: var(--hair-soft); }
.tool .rt .go { display: none; }
.tool-x { display: none; grid-column: 2 / -1; margin: 2px 0 6px; padding: 8px 10px; border-left: 1px dashed var(--hair); font-family: var(--mono); font-size: 11px; line-height: 1.7; color: var(--muted); white-space: pre-wrap; }
.tool.open .tool-x { display: block; }
.tool.open { background: var(--hair-soft); }
.approve { border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--hair)); background: color-mix(in srgb, var(--accent) 6%, var(--glass)); padding: 12px 14px; animation: tool-in 420ms var(--ease) both; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.approve .k { font-family: var(--mono); font-size: 9.5px; letter-spacing: .24em; color: var(--accent-ink); }
.approve b { display: block; margin-top: 4px; font-size: 13.5px; font-weight: 500; }
.approve pre { margin: 8px 0 0; padding: 8px 10px; border: 1px solid var(--hair-soft); background: var(--hair-soft); font-family: var(--mono); font-size: 12px; color: var(--ink); white-space: pre-wrap; }
.approve small { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
.approve .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.approve.done { border-color: var(--hair); background: none; padding: 8px 12px; clip-path: none; }
.approve.done .res { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--muted); }
.msg-acts { display: flex; gap: 2px; margin-top: -4px; opacity: .55; transition: opacity 160ms; }
.e-ai:hover .msg-acts, .msg-acts:focus-within { opacity: 1; }
.msg-acts .icon-btn[aria-pressed="true"] { color: var(--accent-ink); }
.codeblock { position: relative; }
.codeblock .cp { position: absolute; top: 2px; right: 6px; opacity: 0; }
.codeblock:hover .cp, .codeblock .cp:focus-visible { opacity: 1; }
.codeblock:hover .ch span:last-child { visibility: hidden; }
.jump { position: absolute; left: 50%; top: -38px; z-index: 3; transform: translate(-50%, 6px); display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; background: var(--box-bg); color: var(--box-ink); font-size: 12px; opacity: 0; pointer-events: none; transition: opacity 160ms, transform 200ms var(--ease); }
.jump.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.sess { position: relative; }
.sess .more { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; display: none; place-items: center; color: inherit; opacity: .7; }
.sess:hover .more, .sess .more[aria-expanded="true"] { display: grid; }
.sess:hover time { visibility: hidden; }
.sess .more:hover { opacity: 1; background: color-mix(in srgb, currentColor 12%, transparent); }
.sess input.ren { width: 100%; min-width: 0; border: 0; border-bottom: 1px solid var(--accent); background: none; outline: none; font: inherit; color: inherit; padding: 0; }
.chip[aria-expanded="true"] { border-color: var(--hair); color: var(--ink); }
.chip .warn { color: var(--glitch-a); }

@media (max-width: 760px) {

  function onSetClick(e) {
    var t
    if ((t = e.target.closest('[data-sw]'))) {
      var k = t.dataset.sw, on = t.getAttribute('aria-checked') !== 'true'
      t.setAttribute('aria-checked', String(on))
      if (k.indexOf('plug:') === 0) {
        var name = k.slice(5); SET.plugins[name] = on
        var skins = ['dsh-harness-os', '@smalltailqwq/dsh-client-ui-skin-maid-atelier']
        if (on && skins.indexOf(name) !== -1) skins.forEach(function (s) { if (s !== name) SET.plugins[s] = false })
        renderSet('inventory'); toast(on ? '已启用 ' + name + '，重启 DSH 后生效' : '已停用 ' + name, { label: 'PLUGIN' }); return
      }
      if (k.indexOf('st.') === 0) { SET.startup[k.slice(3)] = on; return }
      SET[k] = on
      if (k === 'motionLow') document.documentElement.classList.toggle('no-motion', on)
      toast('设置已保存', { label: 'SAVED', ms: 1600 }); return
    }
    if ((t = e.target.closest('[data-th]'))) { document.documentElement.setAttribute('data-theme', t.dataset.th); try { localStorage.setItem('hos-theme', t.dataset.th) } catch (er) {} renderSet('appearance'); return }
    if ((t = e.target.closest('[data-accent]'))) { applyAccent(t.dataset.accent); renderSet('appearance'); return }
    if ((t = e.target.closest('[data-sttheme]'))) { SET.startup.theme = t.dataset.sttheme; renderSet('startup'); return }
    if ((t = e.target.closest('[data-perm]'))) { setPerm(t.dataset.perm).then(function () { if (setMd) renderSet('perm') }); return }
    if ((t = e.target.closest('[data-pick]'))) {
      var key = t.dataset.pick
      var opts = key === 'sub.depth' ? ['禁用子智能体', '仅允许主 Agent 创建子智能体', '2 层', '3 层'] : ['每次会话', '总是', '每天']
      var cur = key === 'sub.depth' ? SET.sub.depth : SET.startup.mode
      openPop(t, opts.map(function (o) { return pi(o, null, o, { check: o === cur }) }).join(''), { align: 'end', onPick: function (v) {
        if (key === 'sub.depth') { SET.sub.depth = v; renderSet('sub'); markDirty('sub') } else { SET.startup.mode = v; renderSet('startup') }
      } })
      return
    }
    if ((t = e.target.closest('[data-save]'))) { t.disabled = true; toast('已保存', { label: 'SAVED', ms: 1600 }); return }
    if ((t = e.target.closest('[data-reset]'))) { var s = t.dataset.reset; Object.keys(DEF[s]).forEach(function (k2) { SET[s][k2] = DEF[s][k2] }); if (s === 'sub') SET.sub.depth = '2 层'; renderSet(s); toast('已恢复默认值', { ms: 1600 }); return }
    if ((t = e.target.closest('[data-act]'))) {
      var a = t.dataset.act
      if (a === 'update') { t.disabled = true; t.querySelector('span').textContent = '正在检查更新…'; setTimeout(function () { t.disabled = false; t.querySelector('span').textContent = '检查更新'; toast('已是最新版本', { label: 'UPDATE' }) }, 1200) }
      else if (a === 'preview') previewSplash()
      else if (a === 'addprov') openPop(t, pi('third', IC.cube, '第三方模型提供商', { desc: '从内置目录中选择 OpenAI、Anthropic、Kimi 等提供商，填入其 API 密钥即可使用。' }) + pi('custom', IC.term, '自定义模型 API', { desc: '连接中转站、自部署服务或其他兼容 OpenAI / Anthropic 协议的接口。' }), { width: 320, onPick: function () { soon('提供商表单') } })
      else if (a === 'logout') acctMenu($('acct'))
      else soon({ cfg: '打开配置文件', topup: '充值', edit: '提供商编辑' }[a] || '这一项')
    }
  }
  function markDirty(sec) { var b = setMd && setMd.el.querySelector('[data-save="' + sec + '"]'); if (b) b.disabled = false }
  function onSetInput(e) {
    var t = e.target
    if (t.dataset.num) { var p = t.dataset.num.split('.'), n = Number(t.value); if (t.value !== '' && !isNaN(n)) SET[p[0]][p[1]] = n; markDirty(p[0]); var ov = t.closest('.set-row').querySelector('.ov'); var isOv = SET[p[0]][p[1]] !== DEF[p[0]][p[1]]; if (isOv && !ov) t.closest('.set-row').querySelector('.l b').insertAdjacentHTML('beforeend', '<span class="ov">已覆盖</span>'); if (!isOv && ov) ov.remove() }
    if (t.dataset.st) SET.startup[t.dataset.st] = t.dataset.st === 'speed' ? Math.min(3, Math.max(.35, Number(t.value) || 1)) : t.value
    if (t.hasAttribute('data-plugsearch')) {
      var q = t.value.trim().toLowerCase(), n2 = 0
      setMd.el.querySelectorAll('.plug[data-pname]').forEach(function (r) { var hit = !q || r.dataset.pname.toLowerCase().indexOf(q) !== -1; r.hidden = !hit; if (hit) n2++ })
      setMd.el.querySelector('[data-plugempty]').hidden = n2 > 0
    }
  }
  function previewSplash() {
    var S = SET.startup, C = window.__DSH_STARTUP__
    C.mode = 'always'; C.speed = S.speed; C.requireInteraction = S.interact; C.allowSkip = S.skip; C.identity = S.name || 'JOYCE MOORE'; C.identityId = S.id
    if (setMd) { setMd.close(); setMd = null }
    var keep = document.documentElement.getAttribute('data-theme')
    if (S.theme !== keep) { document.documentElement.setAttribute('data-theme', S.theme) }
    $('dReplay').click()
  }

  /* ══ 接线 ═══════════════════════════════════════════════════════════ */
  document.querySelector('.model').addEventListener('click', function (e) { modelMenu(e.currentTarget) })
  $('chipPreset').addEventListener('click', function (e) { presetMenu(e.currentTarget) })
  $('chipPerm').addEventListener('click', function (e) { permMenu(e.currentTarget) })
  $('chipWs').addEventListener('click', function (e) { wsMenu(e.currentTarget) })
  $('chipSkills').addEventListener('click', function (e) { var b = e.target.closest('[data-skill]'); if (b) { STATE.skills.splice(STATE.skills.indexOf(b.dataset.skill), 1); syncComposer() } })
  $('btnAttach').addEventListener('click', function (e) { attachMenu(e.currentTarget) })
  $('btnSkill').addEventListener('click', function (e) { skillMenu(e.currentTarget) })
  $('btnMore').addEventListener('click', function (e) { moreMenu(e.currentTarget) })
  $('btnFilter').addEventListener('click', function (e) { filterMenu(e.currentTarget) })
  $('btnAddWs').addEventListener('click', function () { soon('文件夹选择器') })
  $('acct').addEventListener('click', function (e) { acctMenu(e.currentTarget) })
  document.querySelector('.hos-nav').addEventListener('click', function (e) {
    var b = e.target.closest('.nav-item'); if (!b) return
    var k = b.dataset.nav
    if (k === 'plugins') openSettings('inventory'); else soon(k === 'market' ? '插件市场' : '自动化任务')
  })
  $('tree').addEventListener('click', function (e) {
    var m = e.target.closest('.more'); if (!m) return
    e.stopPropagation(); sessMenu(m, m.closest('.sess').dataset.sid)
  }, true)
  document.querySelector('.dock-strip [aria-label="分栏"]').addEventListener('click', function () { soon('分栏') })
  document.addEventListener('keydown', function (e) {
    var mod = e.metaKey || e.ctrlKey
    if (mod && e.key === ',') { e.preventDefault(); openSettings() }
    if (mod && e.key.toLowerCase() === 'b' && !e.altKey) { e.preventDefault(); toggleSide() }
  })
  syncComposer()

  renderTodos(0, false)
  $('dDock').addEventListener('click', function () { if (dockOpen()) closeDock(); else openDock() })
})()
</script>
</body>
</html>
